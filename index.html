<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | Mahjong3D</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      body { text-align: left; }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        outline: none;
      }
      /* Shown until the engine has drawn its first frame. */
      #unity-loading {
        position: absolute;
        left: 0; top: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cfc7b4;
        font: 14px/1.4 system-ui, "Segoe UI", Arial, sans-serif;
        letter-spacing: .06em;
        text-transform: uppercase;
        pointer-events: none;
      }
      #unity-loading.hidden { display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">Loading Mahjong3D…</div>
    <script src="Build/webgl.loader.js"></script>
    <script>
      // Unity's stock desktop template pins the canvas to a fixed 1600x900 and letterboxes the
      // rest, which is what made the game look like it was not full screen. Drive the drawing
      // buffer from the browser viewport instead so it always fills the window.
      var canvas = document.querySelector("#unity-canvas");

      function resizeCanvasToViewport() {
        var dpr = window.devicePixelRatio || 1;
        var w = Math.max(1, Math.floor(window.innerWidth * dpr));
        var h = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }

      resizeCanvasToViewport();
      window.addEventListener("resize", resizeCanvasToViewport);
      window.addEventListener("orientationchange", resizeCanvasToViewport);

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/webgl.data.unityweb",
        frameworkUrl: "Build/webgl.framework.js.unityweb",
        codeUrl: "Build/webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "OpenCode",
        productName: "Mahjong3D",
        productVersion: "1.0",
        // Keep the WebGL drawing buffer locked to the canvas backing store (the default), so
        // resizing the canvas above actually changes the render resolution.
        matchWebGLToCanvasSize: true,
      }).then((unityInstance) => {
        document.getElementById("unity-loading").classList.add("hidden");
        // The engine may compute its own size on startup; re-assert ours once it is up.
        setTimeout(resizeCanvasToViewport, 0);
        window.addEventListener("resize", function () {
          setTimeout(resizeCanvasToViewport, 0);
        });
      }).catch((message) => {
        var el = document.getElementById("unity-loading");
        if (el) el.textContent = "Failed to start: " + message;
        alert(message);
      });
    </script>
  </body>
</html>
